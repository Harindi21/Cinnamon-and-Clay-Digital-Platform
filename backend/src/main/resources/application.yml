spring:
  application:
    name: cinnamon-clay-cafe-api
  servlet:
    multipart:
      max-file-size: ${MEDIA_MULTIPART_MAX_FILE_SIZE:8MB}
      max-request-size: ${MEDIA_MULTIPART_MAX_REQUEST_SIZE:9MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinnamon_clay}
    username: ${DB_USER:cinnamon_clay}
    password: ${DB_PASSWORD:change-me-locally}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/cinnamon-clay}
          audiences:
            - ${OIDC_AUDIENCE:cinnamon-clay-api}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

media:
  storage:
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_S3_BUCKET:cafe-media}
    access-key: ${MEDIA_S3_ACCESS_KEY:cinnamon_clay}
    secret-key: ${MEDIA_S3_SECRET_KEY:change-me-locally}
  upload:
    max-bytes: ${MEDIA_UPLOAD_MAX_BYTES:8388608}
    max-width: ${MEDIA_UPLOAD_MAX_WIDTH:6000}
    max-height: ${MEDIA_UPLOAD_MAX_HEIGHT:6000}
    max-pixels: ${MEDIA_UPLOAD_MAX_PIXELS:24000000}
    orphan-grace-period: ${MEDIA_ORPHAN_GRACE_PERIOD:PT1H}

app:
  security:
    oidc:
      resource-client-id: ${OIDC_RESOURCE_CLIENT_ID:cinnamon-clay-api}
  public-cache:
    enabled: ${PUBLIC_REVALIDATION_ENABLED:false}
    revalidation-url: ${PUBLIC_REVALIDATION_URL:http://localhost:3000/api/internal/revalidate}
    secret: ${PUBLIC_REVALIDATION_SECRET:}
    timeout: ${PUBLIC_REVALIDATION_TIMEOUT:PT1S}
