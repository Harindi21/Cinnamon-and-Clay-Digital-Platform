spring:
  application:
    name: kirikopi-cafe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kirikopi}
    username: ${DB_USER:kirikopi}
    password: ${DB_PASSWORD:change-me-locally}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/kirikopi}
          audiences:
            - ${OIDC_AUDIENCE:kirikopi-api}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

media:
  storage:
    endpoint: ${MEDIA_S3_ENDPOINT:http://localhost:9000}
    region: ${MEDIA_S3_REGION:us-east-1}
    bucket: ${MEDIA_S3_BUCKET:cafe-media}
    access-key: ${MEDIA_S3_ACCESS_KEY:kirikopi}
    secret-key: ${MEDIA_S3_SECRET_KEY:change-me-locally}

app:
  security:
    oidc:
      resource-client-id: ${OIDC_RESOURCE_CLIENT_ID:kirikopi-api}