services:
  postgres:
    image: postgres:18.6-alpine
    container_name: cinnamon-clay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinnamon_clay}
      POSTGRES_USER: ${POSTGRES_USER:-cinnamon_clay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cinnamon_clay} -d ${POSTGRES_DB:-cinnamon_clay}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    container_name: cinnamon-clay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cinnamon_clay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-locally}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:latest
    container_name: cinnamon-clay-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cinnamon_clay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-locally}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-cafe-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MEDIA_S3_BUCKET"
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: cinnamon-clay-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-change-me-locally}

      KEYCLOAK_DEMO_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:-change-me-locally}
      KEYCLOAK_DEMO_EDITOR_PASSWORD: ${KEYCLOAK_DEMO_EDITOR_PASSWORD:-change-me-locally}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/cinnamon-clay-realm.json:/opt/keycloak/data/import/cinnamon-clay-realm.json:ro
    security_opt:
      - no-new-privileges:true


  backend:
    profiles: ["app"]
    build:
      context: ../backend
    image: ${BACKEND_IMAGE:-cinnamon-clay/backend:local}
    container_name: cinnamon-clay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinnamon_clay}
      DB_USER: ${POSTGRES_USER:-cinnamon_clay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      OIDC_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/cinnamon-clay
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/cinnamon-clay/protocol/openid-connect/certs
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-cinnamon-clay-api}
      OIDC_RESOURCE_CLIENT_ID: ${OIDC_RESOURCE_CLIENT_ID:-cinnamon-clay-api}
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-cafe-media}
      MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cinnamon_clay}
      MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-locally}
      PUBLIC_REVALIDATION_ENABLED: ${PUBLIC_REVALIDATION_ENABLED:-true}
      PUBLIC_REVALIDATION_URL: http://public-web:3000/api/internal/revalidate
      PUBLIC_REVALIDATION_SECRET: ${PUBLIC_REVALIDATION_SECRET:-change-me-locally}
      PUBLIC_REVALIDATION_TIMEOUT: ${PUBLIC_REVALIDATION_TIMEOUT:-PT1S}
      OTLP_TRACING_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local-container}
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    security_opt:
      - no-new-privileges:true

  public-web:
    profiles: ["app"]
    build:
      context: ../public-web
    image: ${PUBLIC_WEB_IMAGE:-cinnamon-clay/public-web:local}
    container_name: cinnamon-clay-public-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      PUBLIC_REVALIDATION_SECRET: ${PUBLIC_REVALIDATION_SECRET:-change-me-locally}
      DEMO_MEDIA_FALLBACK_ENABLED: ${DEMO_MEDIA_FALLBACK_ENABLED:-false}
    ports:
      - "${PUBLIC_WEB_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cinnamon-clay-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.1.3
    container_name: cinnamon-clay-grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data: