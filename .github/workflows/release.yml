name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer without the leading v, for example 1.0.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        name: Resolve and validate release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
            source_revision="$(git rev-parse HEAD)"
            if ! git merge-base --is-ancestor "$source_revision" origin/main; then
              echo "Release tag '${GITHUB_REF_NAME}' is not reachable from origin/main." >&2
              exit 1
            fi
          else
            version="$REQUESTED_VERSION"
          fi
          pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "Invalid SemVer: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode verify
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - name: Verify public web
        working-directory: public-web
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Verify Flutter source
        working-directory: admin-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Build public web
        working-directory: public-web
        run: |
          npm ci
          npm run build
      - name: Install Chromium E2E dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start deterministic browser-test services
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:18082
          PUBLIC_REVALIDATION_SECRET: e2e-only-secret
        run: |
          python tests/e2e/mock_backend.py > "$RUNNER_TEMP/mock-backend.log" 2>&1 &
          (cd public-web && npm start -- --hostname 127.0.0.1 --port 3000) > "$RUNNER_TEMP/public-web.log" 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/api/health/ready', timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('public web did not become ready')
          PY
      - name: Run browser E2E
        run: python -m pytest tests/e2e -q
      - name: Enforce Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false

  build-backend:
    needs: [quality, browser-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/cinnamon-clay-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=v${{ needs.quality.outputs.version }}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - name: Fail release on high/critical image vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: backend.cdx.json
          scanners: vuln
      - uses: actions/upload-artifact@v6
        with:
          name: sbom-backend
          path: backend.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign immutable backend digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  build-public-web:
    needs: [quality, browser-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/cinnamon-clay-public-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=v${{ needs.quality.outputs.version }}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: public-web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-public-web
          cache-to: type=gha,mode=max,scope=release-public-web
      - name: Fail release on high/critical image vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: public-web.cdx.json
          scanners: vuln
      - uses: actions/upload-artifact@v6
        with:
          name: sbom-public-web
          path: public-web.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign immutable public-web digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release-smoke:
    needs: [quality, build-backend, build-public-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start published digests with production container profile
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}@${{ needs.build-backend.outputs.digest }}
          PUBLIC_WEB_IMAGE: ${{ needs.build-public-web.outputs.image }}@${{ needs.build-public-web.outputs.digest }}
        run: |
          cp .env.example .env
          docker pull "$BACKEND_IMAGE"
          docker pull "$PUBLIC_WEB_IMAGE"
          docker compose --env-file .env -f infra/compose.yaml --profile app up -d --no-build
      - name: Smoke published release artifacts
        shell: pwsh
        run: ./tools/smoke-local.ps1 -IncludeWeb -Attempts 45 -RetryDelaySeconds 2
      - name: Capture release-stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yaml --profile app logs --no-color
      - name: Stop release stack
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml --profile app down -v

  manifest:
    needs: [quality, build-backend, build-public-web, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: sbom-*
          path: release
          merge-multiple: true
      - name: Write immutable release manifest
        env:
          RELEASE_VERSION: ${{ needs.quality.outputs.version }}
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          WEB_IMAGE: ${{ needs.build-public-web.outputs.image }}
          WEB_DIGEST: ${{ needs.build-public-web.outputs.digest }}
        run: |
          export SOURCE_REVISION="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          release = Path('release')
          release.mkdir(exist_ok=True)
          manifest = {
              'schemaVersion': '1',
              'releaseVersion': os.environ['RELEASE_VERSION'],
              'source': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'revision': os.environ['SOURCE_REVISION'],
              },
              'images': {
                  'backend': {
                      'ref': os.environ['BACKEND_IMAGE'],
                      'digest': os.environ['BACKEND_DIGEST'],
                      'sbom': 'backend.cdx.json',
                  },
                  'publicWeb': {
                      'ref': os.environ['WEB_IMAGE'],
                      'digest': os.environ['WEB_DIGEST'],
                      'sbom': 'public-web.cdx.json',
                  },
              },
              'generatedAt': datetime.now(timezone.utc).isoformat(),
          }
          (release / 'release-manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY
          python -m json.tool release/release-manifest.json > /dev/null
          python tools/release_manifest.py \
            --manifest release/release-manifest.json \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$SOURCE_REVISION"
          (
            cd release
            sha256sum release-manifest.json > release-manifest.json.sha256
          )
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.quality.outputs.version }}
          path: release/
          retention-days: 90
      - name: Publish GitHub Release for signed tag
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/release-manifest.json
            release/release-manifest.json.sha256
            release/backend.cdx.json
            release/public-web.cdx.json
