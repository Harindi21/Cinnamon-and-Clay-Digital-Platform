name: Android admin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer app version, for example 1.0.0
        required: true
        type: string
      build_number:
        description: Monotonic Android version code
        required: true
        type: number

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mobile-release
    env:
      ANDROID_RELEASE_BASENAME: cinnamon-clay-admin-${{ inputs.version }}-${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install Android API 37 toolchain
        shell: pwsh
        run: ./admin-flutter/tool/ensure_android_sdk.ps1
      - name: Validate immutable release inputs
        shell: bash
        env:
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          ADMIN_OIDC_ISSUER_URL: ${{ vars.ADMIN_OIDC_ISSUER_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ '${{ inputs.version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
            || { echo 'version must be SemVer'; exit 1; }
          [[ '${{ inputs.build_number }}' =~ ^[1-9][0-9]*$ ]] \
            || { echo 'build_number must be a positive integer'; exit 1; }
          (( ${{ inputs.build_number }} <= 2100000000 )) \
            || { echo 'build_number exceeds the Android versionCode limit'; exit 1; }
          test -n "$ADMIN_API_BASE_URL"
          test -n "$ADMIN_OIDC_ISSUER_URL"
          [[ "$ADMIN_API_BASE_URL" == https://* ]]
          [[ "$ADMIN_OIDC_ISSUER_URL" == https://* ]]
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test "$(git describe --tags --exact-match)" = 'v${{ inputs.version }}'
          gh release view 'v${{ inputs.version }}' >/dev/null
      - name: Resolve dependencies and run quality gates
        working-directory: admin-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Verify Gradle wrapper integrity pin
        shell: pwsh
        run: ./admin-flutter/tool/verify_gradle_wrapper_pin.ps1
      - name: Verify Android API 37 toolchain contract
        shell: pwsh
        run: ./admin-flutter/tool/verify_android_toolchain.ps1
      - name: Restore Android signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinnamon-clay-admin.jks"
          chmod 600 "$RUNNER_TEMP/cinnamon-clay-admin.jks"
      - name: Build signed AAB and release manifest
        working-directory: admin-flutter
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cinnamon-clay-admin.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          ADMIN_OIDC_ISSUER_URL: ${{ vars.ADMIN_OIDC_ISSUER_URL }}
        run: |
          set -euo pipefail
          flutter clean
          flutter build appbundle --release \
            --build-name '${{ inputs.version }}' \
            --build-number '${{ inputs.build_number }}' \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=API_BASE_URL="$ADMIN_API_BASE_URL" \
            --dart-define=OIDC_ISSUER_URL="$ADMIN_OIDC_ISSUER_URL" \
            --dart-define=OIDC_CLIENT_ID=cinnamon-clay-admin-mobile \
            --dart-define=OIDC_ALLOW_INSECURE=false

          output_dir=build/app/outputs/bundle/release
          source_aab="$output_dir/app-release.aab"
          evidence_dir=build/release-evidence
          mkdir -p "$evidence_dir"
          aab="$evidence_dir/$ANDROID_RELEASE_BASENAME.aab"
          checksum="$evidence_dir/$ANDROID_RELEASE_BASENAME.aab.sha256"
          signature="$evidence_dir/$ANDROID_RELEASE_BASENAME.signature.txt"
          manifest="$evidence_dir/$ANDROID_RELEASE_BASENAME.release.json"
          cp "$source_aab" "$aab"
          jarsigner -verify -verbose -certs "$aab" > "$signature" 2>&1
          grep -q 'jar verified.' "$signature"
          (
            cd "$evidence_dir"
            sha256sum "$ANDROID_RELEASE_BASENAME.aab" > "$ANDROID_RELEASE_BASENAME.aab.sha256"
          )
          cat "$checksum"
          sha256="$(sha256sum "$aab" | awk '{print $1}')"
          source_revision="$(git -C .. rev-parse HEAD)"

          jq -n \
            --arg version '${{ inputs.version }}' \
            --argjson buildNumber '${{ inputs.build_number }}' \
            --arg sourceRevision "$source_revision" \
            --arg apiBaseUrl "$ADMIN_API_BASE_URL" \
            --arg oidcIssuerUrl "$ADMIN_OIDC_ISSUER_URL" \
            --arg fileName "$ANDROID_RELEASE_BASENAME.aab" \
            --arg sha256 "$sha256" \
            '{
              schemaVersion: 1,
              version: $version,
              buildNumber: $buildNumber,
              applicationId: "dev.cinnamonandclay.admin",
              sourceRevision: $sourceRevision,
              apiBaseUrl: $apiBaseUrl,
              oidcIssuerUrl: $oidcIssuerUrl,
              oidcClientId: "cinnamon-clay-admin-mobile",
              oidcRedirectUrl: "dev.cinnamonandclay.admin:/oauthredirect",
              artifact: {
                fileName: $fileName,
                sha256: $sha256
              }
            }' > "$manifest"
          jq -e '.schemaVersion == 1 and (.artifact.sha256 | length == 64)' \
            "$manifest" >/dev/null
      - name: Attest Android bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: admin-flutter/build/release-evidence/${{ env.ANDROID_RELEASE_BASENAME }}.aab
      - name: Verify stored Android provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh attestation verify
          admin-flutter/build/release-evidence/${ANDROID_RELEASE_BASENAME}.aab
          --repo '${{ github.repository }}'
      - name: Upload immutable mobile release artifact
        uses: actions/upload-artifact@v6
        with:
          name: cinnamon-clay-admin-${{ inputs.version }}-${{ inputs.build_number }}
          path: admin-flutter/build/release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Attach mobile artifacts to the signed platform release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload 'v${{ inputs.version }}' \
            admin-flutter/build/release-evidence/${ANDROID_RELEASE_BASENAME}.aab \
            admin-flutter/build/release-evidence/${ANDROID_RELEASE_BASENAME}.aab.sha256 \
            admin-flutter/build/release-evidence/${ANDROID_RELEASE_BASENAME}.signature.txt \
            admin-flutter/build/release-evidence/${ANDROID_RELEASE_BASENAME}.release.json
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cinnamon-clay-admin.jks"
