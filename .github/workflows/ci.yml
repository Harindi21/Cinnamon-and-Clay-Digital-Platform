name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode verify

  public-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - name: Install dependencies
        working-directory: public-web
        run: npm ci
      - name: Lint
        working-directory: public-web
        run: npm run lint
      - name: Build
        working-directory: public-web
        run: npm run build

  admin-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: admin-flutter
        run: flutter pub get
      - name: Analyze
        working-directory: admin-flutter
        run: flutter analyze
      - name: Test
        working-directory: admin-flutter
        run: flutter test


  ops-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml --profile observability config --quiet
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool infra/observability/grafana/dashboards/cinnamon-clay-overview.json > /dev/null
      - name: Parse PowerShell runbooks
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.Name): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
