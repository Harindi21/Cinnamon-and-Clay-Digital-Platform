name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode verify

  public-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - name: Install dependencies
        working-directory: public-web
        run: npm ci
      - name: Lint
        working-directory: public-web
        run: npm run lint
      - name: Build
        working-directory: public-web
        run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install web dependencies
        working-directory: public-web
        run: npm ci
      - name: Build production web bundle
        working-directory: public-web
        run: npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start deterministic backend and built web application
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:18082
          PUBLIC_REVALIDATION_SECRET: e2e-only-secret
        run: |
          python tests/e2e/mock_backend.py > "$RUNNER_TEMP/mock-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mock-backend.pid"
          (cd public-web && npm start -- --hostname 127.0.0.1 --port 3000) > "$RUNNER_TEMP/public-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/public-web.pid"
          python - <<'PY'
          import time
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/api/health/ready', timeout=2) as response:
                      if response.status == 200:
                          print('public web ready')
                          break
              except Exception:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('public web did not become ready within 60 seconds')
          PY
      - name: Run Chromium E2E suite
        env:
          E2E_WEB_BASE_URL: http://127.0.0.1:3000
        run: python -m pytest tests/e2e -q
      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-e2e-service-logs
          path: |
            ${{ runner.temp }}/mock-backend.log
            ${{ runner.temp }}/public-web.log
          if-no-files-found: ignore

  admin-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install Android API 37 toolchain
        shell: pwsh
        run: ./admin-flutter/tool/ensure_android_sdk.ps1
      - name: Install dependencies
        working-directory: admin-flutter
        run: flutter pub get
      - name: Verify Gradle wrapper integrity pin
        shell: pwsh
        run: ./admin-flutter/tool/verify_gradle_wrapper_pin.ps1
      - name: Verify Android API 37 toolchain contract
        shell: pwsh
        run: ./admin-flutter/tool/verify_android_toolchain.ps1
      - name: Analyze
        working-directory: admin-flutter
        run: flutter analyze
      - name: Test
        working-directory: admin-flutter
        run: flutter test
      - name: Build Android debug APK
        working-directory: admin-flutter
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENVIRONMENT=local
          --dart-define=API_BASE_URL=http://localhost:8082
          --dart-define=OIDC_ISSUER_URL=http://localhost:8081/realms/cinnamon-clay
          --dart-define=OIDC_CLIENT_ID=cinnamon-clay-admin-mobile
          --dart-define=OIDC_ALLOW_INSECURE=true
      - name: Verify AppAuth callback is packaged
        working-directory: admin-flutter
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            build/app/outputs/flutter-apk/app-debug.apk \
            > "$RUNNER_TEMP/admin-debug-manifest.xml"
          grep -q 'net.openid.appauth.RedirectUriReceiverActivity' "$RUNNER_TEMP/admin-debug-manifest.xml"
          grep -q 'dev.cinnamonandclay.admin' "$RUNNER_TEMP/admin-debug-manifest.xml"
      - name: Prove a production-signed app bundle can be built
        working-directory: admin-flutter
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/admin-ci.jks" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias cinnamon-clay-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Cinnamon Clay CI,OU=Engineering,O=Cinnamon Clay,L=Colombo,C=LK"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/admin-ci.jks"
          export ANDROID_KEYSTORE_PASSWORD=ci-only-password
          export ANDROID_KEY_ALIAS=cinnamon-clay-ci
          export ANDROID_KEY_PASSWORD=ci-only-password
          flutter build appbundle --release \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=API_BASE_URL=https://api.invalid.cinnamon-clay.example \
            --dart-define=OIDC_ISSUER_URL=https://identity.invalid.cinnamon-clay.example/realms/cinnamon-clay \
            --dart-define=OIDC_CLIENT_ID=cinnamon-clay-admin-mobile \
            --dart-define=OIDC_ALLOW_INSECURE=false
          jarsigner -verify -verbose -certs \
            build/app/outputs/bundle/release/app-release.aab \
            > "$RUNNER_TEMP/admin-ci-aab-signature.txt" 2>&1
          grep -q 'jar verified.' "$RUNNER_TEMP/admin-ci-aab-signature.txt"

  container-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: public-web
            context: public-web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: cinnamon-clay/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  ops-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file .env.example -f infra/compose.yaml --profile observability config --quiet
          docker compose --env-file .env.example -f infra/compose.yaml --profile app config --quiet
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/infra/observability:/etc/prometheus:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate JSON configuration
        run: |
          python -m json.tool infra/observability/grafana/dashboards/cinnamon-clay-overview.json > /dev/null
          python -m json.tool infra/release/deployment-manifest.schema.json > /dev/null
      - name: Parse PowerShell runbooks
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path tools, admin-flutter/tool -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.Name): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
