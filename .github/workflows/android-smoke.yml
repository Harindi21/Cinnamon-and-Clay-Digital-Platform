name: Android device smoke

on:
  pull_request:
    paths:
      - 'admin-flutter/**'
      - 'infra/keycloak/cinnamon-clay-realm.json'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: admin-flutter
        run: flutter pub get
      - name: Verify Gradle wrapper integrity pin
        shell: pwsh
        run: ./admin-flutter/tool/verify_gradle_wrapper_pin.ps1
      - name: Build debug APK once
        working-directory: admin-flutter
        run: >-
          flutter build apk --debug
          --dart-define=APP_ENVIRONMENT=local
          --dart-define=API_BASE_URL=http://localhost:8082
          --dart-define=OIDC_ISSUER_URL=http://localhost:8081/realms/cinnamon-clay
          --dart-define=OIDC_CLIENT_ID=cinnamon-clay-admin-mobile
          --dart-define=OIDC_ALLOW_INSECURE=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and run native smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          script: |
            cd admin-flutter
            flutter test integration_test/app_smoke_test.dart -d emulator-5554 \
              --dart-define=APP_ENVIRONMENT=local \
              --dart-define=API_BASE_URL=http://localhost:8082 \
              --dart-define=OIDC_ISSUER_URL=http://localhost:8081/realms/cinnamon-clay \
              --dart-define=OIDC_CLIENT_ID=cinnamon-clay-admin-mobile \
              --dart-define=OIDC_ALLOW_INSECURE=true
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W \
              -n dev.cinnamonandclay.admin/.MainActivity
            adb shell pidof dev.cinnamonandclay.admin
            callback="$(adb shell cmd package resolve-activity --brief \
              -a android.intent.action.VIEW \
              -c android.intent.category.BROWSABLE \
              -d 'dev.cinnamonandclay.admin:/oauthredirect' | tr -d '\r')"
            echo "OIDC callback resolves to: $callback"
            echo "$callback" | grep -q 'net.openid.appauth.RedirectUriReceiverActivity'
