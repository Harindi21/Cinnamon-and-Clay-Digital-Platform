name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment approval gate
        required: true
        type: choice
        options:
          - staging
          - production
      release_version:
        description: Tagged release version to promote, without the leading v
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        name: Resolve immutable inputs from tagged release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_VERSION" =~ $version_pattern ]]; then
            echo "Invalid SemVer: $RELEASE_VERSION" >&2
            exit 1
          fi

          tag="v$RELEASE_VERSION"
          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          source_revision="$(git rev-parse "$tag^{commit}" 2>/dev/null || true)"
          if [[ ! "$source_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag '$tag' does not resolve to a commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_revision" origin/main; then
            echo "Release tag '$tag' is not reachable from origin/main." >&2
            exit 1
          fi

          is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "Release '$tag' must be published before promotion." >&2
            exit 1
          fi
          mkdir -p promotion/input
          gh release download "$tag" \
            --pattern 'release-manifest.json*' \
            --dir promotion/input \
            --clobber

          (
            cd promotion/input
            sha256sum --check release-manifest.json.sha256
          )

          python tools/release_manifest.py \
            --manifest promotion/input/release-manifest.json \
            --release-version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$source_revision" \
            --github-output "$GITHUB_OUTPUT"

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Verify tag-bound release signatures before promotion
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          BACKEND_REF: ${{ steps.release.outputs.backend_ref }}
          BACKEND_DIGEST: ${{ steps.release.outputs.backend_digest }}
          PUBLIC_WEB_REF: ${{ steps.release.outputs.public_web_ref }}
          PUBLIC_WEB_DIGEST: ${{ steps.release.outputs.public_web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${RELEASE_VERSION}"
          issuer='https://token.actions.githubusercontent.com'

          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$BACKEND_REF@$BACKEND_DIGEST"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$PUBLIC_WEB_REF@$PUBLIC_WEB_DIGEST"

      - name: Verify referenced digests exist in the registry
        env:
          BACKEND_REF: ${{ steps.release.outputs.backend_ref }}
          BACKEND_DIGEST: ${{ steps.release.outputs.backend_digest }}
          PUBLIC_WEB_REF: ${{ steps.release.outputs.public_web_ref }}
          PUBLIC_WEB_DIGEST: ${{ steps.release.outputs.public_web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$BACKEND_REF@$BACKEND_DIGEST" > /dev/null
          docker buildx imagetools inspect "$PUBLIC_WEB_REF@$PUBLIC_WEB_DIGEST" > /dev/null

      - name: Produce environment deployment manifest
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_MANIFEST_SHA256: ${{ steps.release.outputs.release_manifest_sha256 }}
          BACKEND_REF: ${{ steps.release.outputs.backend_ref }}
          BACKEND_DIGEST: ${{ steps.release.outputs.backend_digest }}
          PUBLIC_WEB_REF: ${{ steps.release.outputs.public_web_ref }}
          PUBLIC_WEB_DIGEST: ${{ steps.release.outputs.public_web_digest }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion/evidence
          cp promotion/input/release-manifest.json promotion/evidence/release-manifest.json
          cp promotion/input/release-manifest.json.sha256 promotion/evidence/release-manifest.json.sha256

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              'schemaVersion': '1',
              'environment': os.environ['TARGET_ENVIRONMENT'],
              'releaseVersion': os.environ['RELEASE_VERSION'],
              'source': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'revision': os.environ['SOURCE_REVISION'],
              },
              'releaseManifest': {
                  'tag': os.environ['RELEASE_TAG'],
                  'fileName': 'release-manifest.json',
                  'sha256': os.environ['RELEASE_MANIFEST_SHA256'],
              },
              'images': {
                  'backend': {
                      'ref': os.environ['BACKEND_REF'],
                      'digest': os.environ['BACKEND_DIGEST'],
                  },
                  'publicWeb': {
                      'ref': os.environ['PUBLIC_WEB_REF'],
                      'digest': os.environ['PUBLIC_WEB_DIGEST'],
                  },
              },
              'promotion': {
                  'actor': os.environ['GITHUB_ACTOR'],
                  'workflowRun': (
                      f"{os.environ['GITHUB_SERVER_URL']}/"
                      f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['GITHUB_RUN_ID']}"
                  ),
              },
              'promotedAt': datetime.now(timezone.utc).isoformat(),
          }
          path = Path('promotion/evidence/deployment-manifest.json')
          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          python -m json.tool promotion/evidence/deployment-manifest.json > /dev/null
          cat promotion/evidence/deployment-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: promotion-${{ inputs.environment }}-${{ inputs.release_version }}
          path: promotion/evidence/
          if-no-files-found: error
          retention-days: 90
