name: Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  branch-and-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|build|perf|chore)/[a-z0-9]+([a-z0-9-]*[a-z0-9])?$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected examples: feat/catalog-admin, fix/menu-price"
            exit 1
          fi

      - name: Validate PR title as Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,80}$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Invalid PR title: $TITLE"
            echo "Example: feat(catalog): add menu management"
            exit 1
          fi

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,100}$'
          failed=0
          while IFS= read -r message; do
            if [[ ! "$message" =~ $pattern ]]; then
              echo "Invalid commit subject: $message"
              failed=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")
          exit "$failed"
