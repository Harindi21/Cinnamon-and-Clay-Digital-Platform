<style>
/* ============================================================
   ENGINE — you shouldn't need to edit below this line
   ============================================================ */
:root{
  --bg:#FBF6EF; --surface:#fff; --ink:#2C1E14; --muted:#7C6A5C;
  --primary:#5C3A21; --accent:#C4823B; --overlay:rgba(30,18,10,.55);
  --radius:18px; --shadow:0 10px 30px rgba(44,30,20,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.container{width:min(1100px,90%);margin:0 auto}
section{padding:84px 0}

/* ---------- nav ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  transition:background .3s,box-shadow .3s,padding .3s;
  padding:22px 0;
}
nav.scrolled{background:var(--bg);box-shadow:0 2px 20px rgba(44,30,20,.1);padding:12px 0}
.nav-inner{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:1.35rem;color:#fff;transition:color .3s}
nav.scrolled .brand{color:var(--primary)}
.brand img{height:40px;width:auto;border-radius:8px}
.nav-links{display:flex;gap:28px;list-style:none;font-size:.92rem;font-weight:500}
.nav-links a{color:rgba(255,255,255,.92);transition:color .2s}
nav.scrolled .nav-links a{color:var(--ink)}
.nav-links a:hover{color:var(--accent)}
.hamburger{display:none;background:none;border:0;cursor:pointer;z-index:60}
.hamburger span{display:block;width:26px;height:2.5px;background:#fff;margin:6px 0;border-radius:2px;transition:.3s}
nav.scrolled .hamburger span{background:var(--primary)}
nav.open .hamburger span{background:var(--primary)}
nav.open .hamburger span:nth-child(1){transform:translateY(8.5px) rotate(45deg)}
nav.open .hamburger span:nth-child(2){opacity:0}
nav.open .hamburger span:nth-child(3){transform:translateY(-8.5px) rotate(-45deg)}

/* ---------- hero ---------- */
header{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  position:relative;text-align:center;color:#fff;
  background-size:cover;background-position:center;
}
header::before{content:"";position:absolute;inset:0;background:var(--overlay)}
.hero-content{position:relative;z-index:2;padding:0 20px;max-width:820px}
.hero-kicker{
  display:inline-block;letter-spacing:.25em;text-transform:uppercase;
  font-size:.78rem;font-weight:600;color:var(--accent);
  border:1px solid rgba(255,255,255,.35);padding:8px 18px;border-radius:999px;
  margin-bottom:26px;background:rgba(0,0,0,.15);backdrop-filter:blur(4px);
}
.hero-content h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:600;line-height:1.08;margin-bottom:18px}
.hero-content p{font-size:clamp(1.02rem,2.2vw,1.25rem);color:rgba(255,255,255,.9);max-width:560px;margin:0 auto 34px}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 30px;border-radius:999px;font-weight:600;font-size:.95rem;
  transition:transform .2s,box-shadow .2s,background .2s;cursor:pointer;border:0;
}
.btn:hover{transform:translateY(-2px)}
.btn-solid{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(4px)}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.7);font-size:1.4rem;animation:bob 2s infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

/* ---------- section headings ---------- */
.sec-head{text-align:center;margin-bottom:52px}
.sec-head .kicker{letter-spacing:.24em;text-transform:uppercase;font-size:.75rem;font-weight:600;color:var(--accent)}
.sec-head h2{font-size:clamp(1.9rem,4.5vw,2.7rem);color:var(--primary);margin-top:10px;font-weight:600}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:center}
.about-img{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/4.6}
.about-img img{width:100%;height:100%;object-fit:cover}
.about-text h2{font-size:clamp(1.8rem,4vw,2.4rem);color:var(--primary);margin-bottom:18px;font-weight:600}
.about-text p{color:var(--muted);margin-bottom:14px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.feature{background:var(--surface);border-radius:14px;padding:18px 16px;box-shadow:var(--shadow)}
.feature .ficon{font-size:1.5rem}
.feature h3{font-size:.98rem;margin:8px 0 4px;color:var(--primary)}
.feature p{font-size:.83rem;color:var(--muted);margin:0}

/* ---------- menu ---------- */
#menu{background:var(--surface)}
.menu-note{text-align:center;color:var(--muted);font-size:.9rem;margin:-34px 0 44px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px 64px}
.menu-cat h3{
  font-size:1.35rem;color:var(--primary);font-weight:600;margin-bottom:18px;
  display:flex;align-items:center;gap:14px;
}
.menu-cat h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.menu-item{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed rgba(124,106,92,.25)}
.menu-item:last-child{border-bottom:0}
.mi-name{font-weight:600;font-size:.98rem}
.mi-desc{font-size:.84rem;color:var(--muted)}
.mi-price{font-weight:600;color:var(--accent);white-space:nowrap;font-size:.95rem}

/* ---------- gallery ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g-item{border-radius:14px;overflow:hidden;aspect-ratio:1/1;box-shadow:var(--shadow);background:linear-gradient(135deg,var(--primary),var(--accent))}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.g-item:hover img{transform:scale(1.06)}

/* ---------- reviews ---------- */
#reviews{background:var(--surface)}
.reviews-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.review{background:var(--bg);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.stars{color:var(--accent);letter-spacing:2px}
.review p{color:var(--ink);font-size:.95rem;flex:1}
.review .rname{font-weight:600;font-size:.88rem;color:var(--muted)}

/* ---------- visit ---------- */
.visit-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:stretch}
.map-wrap{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);min-height:340px}
.map-wrap iframe{width:100%;height:100%;min-height:340px;border:0}
.visit-info{display:flex;flex-direction:column;gap:22px;justify-content:center}
.vi-block h3{color:var(--primary);font-size:1.1rem;margin-bottom:8px;font-weight:600}
.vi-block p,.vi-block a{color:var(--muted);font-size:.95rem}
.vi-block a:hover{color:var(--accent)}
.hours-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(124,106,92,.25);font-size:.93rem}
.hours-row:last-child{border-bottom:0}
.hours-row .d{font-weight:500}
.hours-row .t{color:var(--muted)}

/* ---------- footer ---------- */
footer{background:var(--primary);color:rgba(255,255,255,.85);padding:44px 0;text-align:center}
footer .fbrand{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;color:#fff}
.socials{display:flex;gap:18px;justify-content:center;margin:18px 0}
.socials a{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);transition:background .2s,transform .2s;font-size:1.1rem;
}
.socials a:hover{background:var(--accent);transform:translateY(-2px)}
footer .credit{font-size:.8rem;color:rgba(255,255,255,.55);margin-top:10px}
footer .credit a{text-decoration:underline}

/* ---------- whatsapp float ---------- */
.wa-float{
  position:fixed;bottom:24px;right:24px;z-index:40;
  width:60px;height:60px;border-radius:50%;background:#25D366;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(37,211,102,.45);transition:transform .2s;
}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:32px;height:32px;fill:#fff}

/* ---------- reveal animation ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}

/* ---------- mobile ---------- */
@media (max-width:860px){
  section{padding:60px 0}
  .hamburger{display:block}
  .nav-links{
    position:fixed;inset:0;background:var(--bg);flex-direction:column;
    align-items:center;justify-content:center;gap:30px;font-size:1.2rem;
    transform:translateX(100%);transition:transform .35s;z-index:55;
  }
  nav.open .nav-links{transform:none}
  nav.open .nav-links a{color:var(--ink)}
  .about-grid,.visit-grid,.menu-grid{grid-template-columns:1fr}
  .about-img{aspect-ratio:4/3}
  .features{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:repeat(2,1fr)}
  .reviews-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* ============================================================
   RENDER ENGINE — reads CONFIG and builds the page
   ============================================================ */
(function(){
  const C = CONFIG, $ = id => document.getElementById(id);

  /* theme */
  const t = C.theme, r = document.documentElement.style;
  r.setProperty('--bg', t.background); r.setProperty('--surface', t.surface);
  r.setProperty('--ink', t.ink);       r.setProperty('--muted', t.muted);
  r.setProperty('--primary', t.primary); r.setProperty('--accent', t.accent);
  r.setProperty('--overlay', t.heroOverlay);
  document.title = C.name + " — " + C.tagline;

  /* brand + hero */
  $('brand').innerHTML = C.logoUrl
    ? `<img src="${C.logoUrl}" alt="${C.name} logo"><span>${C.name}</span>`
    : `<span>${C.logoMark}</span><span>${C.name}</span>`;
  const header = document.querySelector('header');
  header.style.backgroundImage = `url('${C.images.hero}'), linear-gradient(150deg, ${t.primary}, ${t.ink})`;
  header.style.backgroundSize = 'cover, cover';
  $('heroNote').textContent = C.heroNote;
  $('heroName').textContent = C.name;
  $('heroTagline').textContent = C.tagline;

  /* about */
  $('aboutImg').src = C.images.about;
  $('aboutTitle').textContent = C.about.title;
  $('aboutParas').innerHTML = C.about.paragraphs.map(p=>`<p>${p}</p>`).join('');
  $('features').innerHTML = C.about.features.map(f=>
    `<div class="feature"><div class="ficon">${f.icon}</div><h3>${f.title}</h3><p>${f.text}</p></div>`).join('');

  /* menu */
  $('menuNote').textContent = C.menuNote;
  $('menuGrid').innerHTML = C.menu.map(cat=>`
    <div class="menu-cat reveal">
      <h3>${cat.category}</h3>
      ${cat.items.map(i=>`
        <div class="menu-item">
          <div><div class="mi-name">${i.name}</div><div class="mi-desc">${i.desc}</div></div>
          <div class="mi-price">${i.price}</div>
        </div>`).join('')}
    </div>`).join('');

  /* gallery (with graceful fallback if an image fails) */
  $('galleryGrid').innerHTML = C.images.gallery.map(src=>
    `<div class="g-item reveal"><img src="${src}" alt="Cafe photo" onerror="this.remove()"></div>`).join('');

  /* reviews */
  $('reviewsGrid').innerHTML = C.reviews.map(rv=>`
    <div class="review reveal">
      <div class="stars">${"★".repeat(rv.stars)}${"☆".repeat(5-rv.stars)}</div>
      <p>“${rv.text}”</p><div class="rname">— ${rv.name}</div>
    </div>`).join('');

  /* visit */
  $('mapFrame').src = C.visit.mapEmbed;
  $('viAddress').textContent = C.visit.address;
  $('viHours').innerHTML = C.visit.hours.map(h=>
    `<div class="hours-row"><span class="d">${h.day}</span><span class="t">${h.time}</span></div>`).join('');
  const ph = $('viPhone'); ph.textContent = C.visit.phone; ph.href = 'tel:' + C.visit.phone.replace(/\s/g,'');
  const em = $('viEmail'); em.textContent = C.visit.email; em.href = 'mailto:' + C.visit.email;

  /* footer */
  $('footBrand').textContent = C.name;
  $('footCopy').textContent = `© ${new Date().getFullYear()} ${C.name}. All rights reserved.`;
  if (C.credit && C.credit.label)
    $('footCredit').innerHTML = `<a href="${C.credit.url}" target="_blank" rel="noopener">${C.credit.label}</a>`;
  const socIcons = { instagram:'📸', facebook:'👍', tiktok:'🎵' };
  $('socials').innerHTML = Object.entries(C.social)
    .filter(([,url])=>url)
    .map(([k,url])=>`<a href="${url}" target="_blank" rel="noopener" title="${k}">${socIcons[k]||'🔗'}</a>`).join('');

  /* whatsapp */
  if (C.whatsapp && C.whatsapp.enabled && C.whatsapp.number){
    const wa = $('waFloat');
    wa.href = `https://wa.me/${C.whatsapp.number}?text=${encodeURIComponent(C.whatsapp.prefill||'')}`;
    wa.style.display = 'flex';
  }

  /* nav behaviour */
  const nav = $('nav');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 40);
  window.addEventListener('scroll', onScroll); onScroll();
  $('hamburger').addEventListener('click', ()=> nav.classList.toggle('open'));
  document.querySelectorAll('.nav-links a').forEach(a=>
    a.addEventListener('click', ()=> nav.classList.remove('open')));

  /* reveal on scroll */
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
